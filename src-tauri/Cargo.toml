[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sysinfo = "0.33"
walkdir = "2"
dirs = "5"
plist = "1"
sha2 = "0.10"
whoami = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
trash = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# Used to read the same volume-capacity values macOS's own Storage settings
# does (NSURLVolumeAvailableCapacityForImportantUsageKey), rather than raw
# statfs, which reports free space differently (see src/disk.rs).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSURL",
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSString",
    "NSValue",
    "NSObject",
] }
