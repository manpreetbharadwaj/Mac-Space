[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# `multithread` (rayon) left off: refreshing ~700 processes takes ~20 ms on
# one thread, and the parallel pool's spin-waiting cost more CPU than it
# saved for the background performance monitor (measured; see performance.rs).
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "user", "component", "network"] }
walkdir = "2"
dirs = "5"
plist = "1"
sha2 = "0.10"
whoami = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
trash = "5"
tauri-plugin-notification = "2.4.0"
url = "2"
base64 = "0.22"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
# Used only to pump the current thread's run loop briefly while waiting for
# a UNUserNotificationCenter completion handler — see native_notifications.rs.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFRunLoop", "CFDate", "CFBase", "std"] }
# Used to read the same volume-capacity values macOS's own Storage settings
# does (NSURLVolumeAvailableCapacityForImportantUsageKey), rather than raw
# statfs, which reports free space differently (see src/disk.rs).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSURL",
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSString",
    "NSValue",
    "NSObject",
    "NSProcessInfo",
    "NSGeometry",
] }
# Performance + Mac Health (see processes.rs, iokit.rs, device_health.rs,
# login_item.rs): running-app list/icons/termination, IOKit registry and
# IOPowerSources via CoreFoundation types, and SMAppService for launch at login.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "objc2-core-foundation", "libc"] }
core-foundation = "0.10"
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationTrigger", "UNNotificationResponse", "UNNotification", "UNNotificationSettings", "UNError", "std", "block2"] }
